

[env:miniwx]
platform      = espressif8266
board         = esp12e               ; ESP-12 / 4MB. Schimba daca placa ta difera.
framework     = arduino
monitor_speed = 74880                ; = SER_MON_BAUDRATE din sketch
upload_speed  = 921600
board_build.filesystem = spiffs      ; sketch-ul foloseste SPIFFS (ssid/station/settings/logger)

lib_deps =
    sparkfun/SparkFun BME280@^2.0.9
    https://github.com/SensorsIot/NTPtimeESP.git

; Note:
;  - ESP8266WiFi, ESP8266WebServer, ArduinoOTA, Ticker, Wire, SPI, FS fac parte
;    din core-ul ESP8266, nu trebuie adaugate in lib_deps.
;  - La prima pornire pe placa, formateaza SPIFFS din meniul serial (tasta 'm'),
;    exact ca pe firmware-ul original.
